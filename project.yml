name: Blob
options:
  bundleIdPrefix: app.blob
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH[config=Debug]: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Blob:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    scheme: {}
    sources:
      - path: Blob
        excludes:
          - "**/.DS_Store"
      - path: Shared/Bridge.swift
    info:
      path: Blob/Info.plist
      properties:
        CFBundleDisplayName: Blob
        CFBundleName: Blob
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        NSCalendarsFullAccessUsageDescription: Blob shows your next events in the notch.
        NSCalendarsUsageDescription: Blob shows your next events in the notch.
        NSCameraUsageDescription: Blob shows a mirror when you open the Camera tab.
        NSAppleEventsUsageDescription: Blob reads and controls Music and Spotify, and can toggle dark mode.
        BlobSourcePath: $(PROJECT_DIR)
        NSLocalNetworkUsageDescription: Blob shares Claude Code status with Blob on your iPhone.
        NSBonjourServices:
          - _blob._tcp
    entitlements:
      path: Blob/Blob.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blob.Blob
        PRODUCT_NAME: Blob
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    postCompileScripts:
      - name: Embed MediaRemoteAdapter
        basedOnDependencyAnalysis: false
        script: |
          SRC="${PROJECT_DIR}/Vendor/MediaRemoteAdapter"
          FW_DST="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          RES_DST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ -d "$SRC/MediaRemoteAdapter.framework" ] && [ -f "$SRC/mediaremote-adapter.pl" ]; then
            mkdir -p "$FW_DST" "$RES_DST"
            rsync -a --delete "$SRC/MediaRemoteAdapter.framework" "$FW_DST/"
            cp "$SRC/mediaremote-adapter.pl" "$RES_DST/"
            if [ -n "${EXPANDED_CODE_SIGN_IDENTITY}" ] && [ "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]; then
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime --timestamp=none "$FW_DST/MediaRemoteAdapter.framework"
            else
              codesign --force --sign - "$FW_DST/MediaRemoteAdapter.framework"
            fi
          else
            echo "warning: MediaRemoteAdapter not vendored. Run scripts/fetch-mediaremote-adapter.sh (needed for Now Playing on macOS 15.4+)."
          fi

  BlobPhone:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    scheme: {}
    deploymentTarget: "17.0"
    sources:
      - path: iOS/BlobPhone
      - path: Shared
      - path: Blob/Core/Theme.swift
      - path: Blob/Core/Springs.swift
      - path: Blob/Core/Components.swift
      - path: Blob/Core/Character
      - path: Blob/Modules/Ask/Keychain.swift
    dependencies:
      - target: BlobIsland
    info:
      path: iOS/BlobPhone/Info.plist
      properties:
        CFBundleDisplayName: Blob
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: Blob finds Blob on your Mac to show Claude Code status.
        NSBonjourServices:
          - _blob._tcp
        NSCalendarsFullAccessUsageDescription: Blob counts down to your next event in the Dynamic Island.
        NSCalendarsUsageDescription: Blob counts down to your next event in the Dynamic Island.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blob.BlobPhone
        PRODUCT_NAME: Blob
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  BlobIsland:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    deploymentTarget: "17.0"
    sources:
      - path: iOS/BlobIsland
      - path: Shared/BlobActivity.swift
      - path: Shared/BlobFace.swift
      - path: Blob/Core/Character/Mood.swift
    info:
      path: iOS/BlobIsland/Info.plist
      properties:
        CFBundleDisplayName: Blob Island
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blob.BlobPhone.Island
        PRODUCT_NAME: BlobIsland
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
