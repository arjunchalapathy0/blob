<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="Blob in the MacBook notch: album art on the left, the grey Blob character hopping to music in the middle, an equalizer on the right">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e8e93"/>
      <stop offset="1" stop-color="#3a3a3c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6a6aa"/>
      <stop offset="1" stop-color="#86868a"/>
    </linearGradient>
    <clipPath id="frame"><rect width="880" height="230" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="230" fill="url(#screen)"/>
    <!-- menu bar -->
    <rect width="880" height="34" fill="#000" opacity="0.28"/>
    <circle cx="28" cy="17" r="5" fill="#fff" opacity="0.5"/>
    <rect x="46" y="12" width="34" height="10" rx="5" fill="#fff" opacity="0.32"/>
    <rect x="92" y="12" width="26" height="10" rx="5" fill="#fff" opacity="0.22"/>
    <rect x="130" y="12" width="30" height="10" rx="5" fill="#fff" opacity="0.22"/>
    <rect x="770" y="12" width="22" height="10" rx="5" fill="#fff" opacity="0.22"/>
    <rect x="804" y="12" width="50" height="10" rx="5" fill="#fff" opacity="0.32"/>

    <!-- notch with wings -->
    <path d="M196 0 Q210 0 210 14 V52 Q210 78 236 78 H644 Q670 78 670 52 V14 Q670 0 684 0 Z" fill="#000"/>

    <!-- left wing: artwork + track -->
    <rect x="230" y="18" width="42" height="42" rx="10" fill="url(#art)"/>
    <rect x="284" y="26" width="70" height="9" rx="4.5" fill="#fff" opacity="0.85"/>
    <rect x="284" y="43" width="48" height="8" rx="4" fill="#fff" opacity="0.4"/>

    <!-- Blob, hopping to the beat and blinking -->
    <g transform="translate(440 54)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 0" keyTimes="0;0.25;0.5;1" dur="0.75s" calcMode="spline" keySplines="0.3 0 0.4 1;0.6 0 0.7 1;0 0 1 1" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="scale" values="1.06 0.92;0.97 1.04;1.06 0.92;1.06 0.92" keyTimes="0;0.25;0.5;1" dur="0.75s" repeatCount="indefinite"/>
          <rect x="-25" y="-38" width="50" height="38" rx="14" fill="url(#body)"/>
          <g transform="translate(0 -19)">
            <g>
              <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.12;1 1" keyTimes="0;0.9;0.94;1" dur="3.6s" repeatCount="indefinite"/>
              <rect x="-11" y="-6.5" width="5.5" height="13" rx="2.75" fill="#000"/>
              <rect x="5.5" y="-6.5" width="5.5" height="13" rx="2.75" fill="#000"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- right wing: equalizer -->
    <g fill="#fff" opacity="0.85">
      <rect x="590" y="30" width="6" height="22" rx="3"><animate attributeName="height" values="10;26;14;22;10" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="46;30;42;34;46" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="602" y="30" width="6" height="22" rx="3"><animate attributeName="height" values="22;12;28;10;22" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="34;44;28;46;34" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="614" y="30" width="6" height="22" rx="3"><animate attributeName="height" values="14;28;18;8;14" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="42;28;38;48;42" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="626" y="30" width="6" height="22" rx="3"><animate attributeName="height" values="26;10;20;24;26" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="30;46;36;32;30" dur="1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- desktop hint -->
    <rect x="300" y="140" width="280" height="10" rx="5" fill="#fff" opacity="0.06"/>
    <rect x="340" y="162" width="200" height="10" rx="5" fill="#fff" opacity="0.04"/>
  </g>
</svg>
